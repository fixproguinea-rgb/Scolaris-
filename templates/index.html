<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scolaris · La scolarité, sans impayés</title>
<meta name="description" content="Scolaris : gérez facilement les paiements scolaires de votre établissement.">
<meta name="theme-color" content="#1840B8">
<link rel="icon" href="{{ url_for('static', filename='img/icone.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icone-180.png') }}">
<style>
/* Ecran d'accueil : la maquette validee, sur un seul ecran (aucun defilement). */
html,body{margin:0;height:100%;overflow:hidden;background:#EEF4FF}
.ecran{position:fixed;inset:0;overflow:hidden;background:#EAF2FF}
/* fond : la meme image, floutee, pour remplir les bords si l'ecran n'a pas exactement le format */
.fond{position:absolute;inset:-30px;background:url("{{ url_for('static', filename='img/accueil-maquette.jpg') }}") center/cover no-repeat;filter:blur(18px)}
/* la maquette entiere (852 x 1846), toujours visible en entier, centree */
.maquette{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:852/1846;
  width:min(100vw, calc(100vh * 852 / 1846 * 1.06));
  background:url("{{ url_for('static', filename='img/accueil-maquette.jpg') }}") center/100% 100% no-repeat}
@supports (height:100dvh){.maquette{width:min(100vw, calc(100dvh * 852 / 1846 * 1.06))}}
@media (min-aspect-ratio:3/4){.fond{filter:blur(40px);opacity:.55}.ecran{background:#DCE7FF}}
.zone{position:absolute;display:block;border-radius:99px;-webkit-tap-highlight-color:rgba(24,64,184,.15)}
.zone:focus-visible{outline:3px solid #22C55E;outline-offset:2px}
.connexion{left:5.8%;width:88.4%;top:63.2%;height:6.1%}
.compte{left:5.8%;width:88.4%;top:70.4%;height:5.6%}
.lu{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head><body>
<main class="ecran">
 <div class="fond"></div>
 <div class="maquette" role="img" aria-label="Scolaris, la scolarité sans impayés. Bienvenue sur Scolaris ! Gérez facilement les paiements scolaires de votre établissement.">
  <a class="zone connexion" href="{{ url_for('connexion') }}"><span class="lu">Se connecter</span></a>
  <a class="zone compte" href="{{ url_for('inscription') }}"><span class="lu">Créer un compte</span></a>
 </div>
</main>
</body></html>
